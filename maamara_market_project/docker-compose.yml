services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maamara_db}
      POSTGRES_USER: ${POSTGRES_USER:-maamara_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maamara_user} -d ${POSTGRES_DB:-maamara_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: maamara-market-backend:dev
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/project01/.env
    environment:
      DEBUG: "${DEBUG:-false}"
      POSTGRES_DB: ${POSTGRES_DB:-maamara_db}
      POSTGRES_USER: ${POSTGRES_USER:-maamara_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      MAAMARAMARKET_PUBLIC_BASE_URL: ${MAAMARAMARKET_PUBLIC_BASE_URL:-http://localhost:5173}
      MAAMARAMARKET_PUBLIC_PATH_PREFIX: ${MAAMARAMARKET_PUBLIC_PATH_PREFIX-/maamara}
      MAAMARAMARKET_PUBLIC_FRONTEND_URL: ${MAAMARAMARKET_PUBLIC_FRONTEND_URL:-${MAAMARAMARKET_PUBLIC_BASE_URL:-http://localhost:5173}}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-${MAAMARAMARKET_PUBLIC_BASE_URL:-http://localhost:5173}}
      FRONTEND_URL: ${FRONTEND_URL:-${MAAMARAMARKET_PUBLIC_FRONTEND_URL:-${MAAMARAMARKET_PUBLIC_BASE_URL:-http://localhost:5173}}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${MAAMARAMARKET_PUBLIC_BASE_URL:-http://localhost:5173},http://localhost:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-${MAAMARAMARKET_PUBLIC_BASE_URL:-http://localhost:5173},http://localhost:5173}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost,backend}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_static:/app/static
      - backend_media:/app/media
    # Use the repository's Daphne startup script. Django's runserver
    # derives ASGI root_path from FORCE_SCRIPT_NAME, which conflicts with
    # Caddy stripping /maamara before forwarding WebSocket requests.
    command: ["bash", "./entrypoint.production.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    image: maamara-market-backend:dev
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/project01/.env
    environment:
      DEBUG: "${DEBUG:-false}"
      POSTGRES_DB: ${POSTGRES_DB:-maamara_db}
      POSTGRES_USER: ${POSTGRES_USER:-maamara_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      MAAMARAMARKET_PUBLIC_BASE_URL: ${MAAMARAMARKET_PUBLIC_BASE_URL:-http://localhost:5173}
      MAAMARAMARKET_PUBLIC_PATH_PREFIX: ${MAAMARAMARKET_PUBLIC_PATH_PREFIX-/maamara}
      MAAMARAMARKET_PUBLIC_FRONTEND_URL: ${MAAMARAMARKET_PUBLIC_FRONTEND_URL:-${MAAMARAMARKET_PUBLIC_BASE_URL:-http://localhost:5173}}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-${MAAMARAMARKET_PUBLIC_BASE_URL:-http://localhost:5173}}
      FRONTEND_URL: ${FRONTEND_URL:-${MAAMARAMARKET_PUBLIC_FRONTEND_URL:-${MAAMARAMARKET_PUBLIC_BASE_URL:-http://localhost:5173}}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${MAAMARAMARKET_PUBLIC_BASE_URL:-http://localhost:5173},http://localhost:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-${MAAMARAMARKET_PUBLIC_BASE_URL:-http://localhost:5173},http://localhost:5173}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost,backend}
    volumes:
      - ./backend:/app
    command: celery -A project01 worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    image: maamara-market-backend:dev
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/project01/.env
    environment:
      DEBUG: "${DEBUG:-false}"
      POSTGRES_DB: ${POSTGRES_DB:-maamara_db}
      POSTGRES_USER: ${POSTGRES_USER:-maamara_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      MAAMARAMARKET_PUBLIC_BASE_URL: ${MAAMARAMARKET_PUBLIC_BASE_URL:-http://localhost:5173}
      MAAMARAMARKET_PUBLIC_PATH_PREFIX: ${MAAMARAMARKET_PUBLIC_PATH_PREFIX-/maamara}
      MAAMARAMARKET_PUBLIC_FRONTEND_URL: ${MAAMARAMARKET_PUBLIC_FRONTEND_URL:-${MAAMARAMARKET_PUBLIC_BASE_URL:-http://localhost:5173}}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-${MAAMARAMARKET_PUBLIC_BASE_URL:-http://localhost:5173}}
      FRONTEND_URL: ${FRONTEND_URL:-${MAAMARAMARKET_PUBLIC_FRONTEND_URL:-${MAAMARAMARKET_PUBLIC_BASE_URL:-http://localhost:5173}}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${MAAMARAMARKET_PUBLIC_BASE_URL:-http://localhost:5173},http://localhost:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-${MAAMARAMARKET_PUBLIC_BASE_URL:-http://localhost:5173},http://localhost:5173}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost,backend}
    volumes:
      - ./backend:/app
      - celerybeat_data:/var/lib/celerybeat
    command: celery -A project01 beat --loglevel=info --schedule=/var/lib/celerybeat/celerybeat-schedule
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  pending-registration-cleanup:
    # Reuse the backend image; do not build/install Python dependencies a second time.
    image: maamara-market-backend:dev
    restart: unless-stopped
    env_file:
      - ./backend/project01/.env
    environment:
      DEBUG: "${DEBUG:-false}"
      POSTGRES_DB: ${POSTGRES_DB:-maamara_db}
      POSTGRES_USER: ${POSTGRES_USER:-maamara_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    command: >
      sh -c "until python manage.py cleanup_pending_registrations; do
             echo 'Waiting for Django migrations before pending-registration cleanup...';
             sleep 10;
             done;
             while true; do
               sleep 60;
               python manage.py cleanup_pending_registrations;
             done"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        # These are public OAuth client IDs, not client secrets. Empty build args
        # fall back to frontend/.env in the Docker build context.
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_IOS_CLIENT_ID: ${VITE_GOOGLE_IOS_CLIENT_ID:-}
        VITE_PUBLIC_BASE_PATH: /maamara/
        VITE_ROUTER_BASENAME: /maamara
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Local path router for the shared Tailscale testing hostname.
  shared-hostname-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile.testing:/etc/caddy/Caddyfile:ro

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  backend_static:
  backend_media:
  celerybeat_data:
