server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The HTML shell should revalidate so new deployments are picked up promptly.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Vite emits content-hashed assets; cache them for a year.
    location ~* "^/assets/.+[-.][A-Za-z0-9_-]{8,}\\.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$" {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Maa Mara is published below /maamara/ by the shared-hostname proxy.
    # Strip that public prefix before looking up files in the document root.
    location ^~ /maamara/assets/ {
        rewrite ^/maamara/(.*)$ /$1 break;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Serve root-level public files (for example the brand artwork) and
    # let React Router handle application routes under /maamara/.
    location ^~ /maamara/ {
        rewrite ^/maamara/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # Compress text-based responses and frontend assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/manifest+json;

    # React Router handles client-side routes at the root deployment too.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
