services:
  db:
    image: postgres:18
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file:
      - .env.db

  maamaramarket:
    build: .
    container_name: maamaramarket
    user: "1000:1000"
    depends_on:
      - db
    volumes:
      - ./static:/app/static/
    env_file:
      - project01/.env

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  proxy:
    image: nginx:latest
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/static:ro
    depends_on:
      - maamaramarket

volumes:
  postgres_data:
