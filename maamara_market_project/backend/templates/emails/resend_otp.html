<html>
  <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f9f9f9; margin: 0; padding: 0;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f9f9f9; padding: 20px 0;">
      <tr>
        <td align="center">
          <table width="600" cellpadding="0" cellspacing="0" style="background-color: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e0e0e0;">
            <tr>
              <td style="padding: 20px;">
                <h2 style="color: #264653;">Hi {{ first_name }},</h2>
                <p>You requested a new One-Time Password (OTP) for your <strong>Maa Mara Market</strong> account:</p>

                <div style="display: flex; justify-content: center; align-items: center;">
                  <p style="font-size: 24px; font-weight: bold; color: #2a9d8f; margin: 20px 0; display: flex; justify-content: center; background-color: rgba(170, 216, 247, 0.315); width: fit-content; padding: 5px 5px;">
                    {{ otp }}
                  </p>
                </div>

                <p>Please enter this code within <strong>{{ otp_expiry_minutes }} minutes</strong> to verify your account.</p>

                <p style="margin-top: 30px;">Cheers,<br><strong>Maa Mara Market Team</strong></p>

                <hr style="border: none; border-top: 1px solid #e0e0e0; margin: 20px 0;">

                <p style="font-size: 12px; color: #777;">If you did not request this OTP, please ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
