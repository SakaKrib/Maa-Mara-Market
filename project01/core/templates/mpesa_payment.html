{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Pesa Payment</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .custom-container {
            height: 80vh;
            width: 600px;
            padding: 20px;
            line-height: 100px;
            margin: auto;
            background-color: #f9f9f9;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        .form-control:focus {
            outline: none;
            border: 2px solid #007bff;
            box-shadow: none;
        }
        .form-group label {
            position: relative;
            top: -25px;
            left: 5px;
            font-size: 0.9rem;
            color: #495057;
            padding: 20px 5px;
        }
    </style>
</head>
<body>
    <div class="custom-container mt-5">
        <h2 class="text-center">M-Pesa Payment</h2>
        <p class="text-center">Please enter your phone number to proceed with payment.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'order:mpesa_payment' %}">
            {% csrf_token %}
            <div class="form-group position-relative">
                <label for="phone_number" class="valid">Phone Number</label>
                <input type="text" class="form-control" id="phone_number" name="phone_number" placeholder="07XXXXXXXX" required>
            </div>
            <div class="form-group position-relative">
                <label for="amount" class="valid">Amount (KES)</label>
                <input type="number" class="form-control" id="amount" name="amount" placeholder="Enter amount" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block mt-5">Pay Now</button>
        </form>
    </div>
</body>
</html>
