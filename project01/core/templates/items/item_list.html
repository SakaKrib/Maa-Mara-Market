{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    

           


<div class="productlist">


     <!---------------serach engine start-->
     <div id="search-container">
        <h2>New Items</h2>
        <style>
            h2{
                position: absolute;
            }
        </style>
                 
        <label class="search" id="search_engine"><button>search</button></label>
        <label for="search_engine"><ion-icon name="search-outline" class="search-outline"></ion-icon></label>

       <div class="search-input"> <input type="search" placeholder="search" id="search_engine"></div></div>

<!--------------------favourite icons------------------->

<div class="favourite-icon"><ion-icon name="heart"></ion-icon><span class="fav-number">0</span></div>  

<!---------------------cart icons----------------------->

<div class="cart-icon"><ion-icon name="cart-outline"></ion-icon><span class="number">0</span></div>   



        {% for item in items %}
        <div class="content" >
           
            <a class="details" href="{% url 'item_detail' pk=item.pk %}">
            <img src="{{ item.image.url }}" alt=""></a>
            <!------------------------------love--icon----------------------------------------->
    
            <span class="love"><ion-icon name="heart"></ion-icon></span>
            <p class="item_name">{{ item.name }}</p>
            <div class="price_list"><h1>Ksh.</h1><h1 class="price"> {{ item.price }} </h1></div><h2>3,017/-</h2>
           <button class="pluscart"> Add to Cart</button>
            <!--------------------------------iconstarchecked-------------------------------->
    
            <span class="rates"><ion-icon name="star"></ion-icon></span>
            <span class="rates"><ion-icon name="star"></ion-icon></span>
            <span class="rates"><ion-icon name="star"></ion-icon></span>
            <span class="rates"><ion-icon name="star"></ion-icon></span>
            <span class="rates"><ion-icon name="star-half-outline"></ion-icon></span>
         </div>{% endfor %}</div>



    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    

    <script src="{% static 'js.js' %}"></script>

</body>
</html>
