{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>Maa Mara Market || register</title>
        <link rel="stylesheet" href="{% static 'style.css' %}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        
       
    
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    </head>

    <body>
        
        <div class="register_container">

        
            <div class="form-box login">
                <h2>Sign-Up</h2>

                <style>
                    h5{color: red; font-family: jayb;}
                </style>

                {%  for message in messages %}
                <h5>{{message}}</h5>
                 {% endfor %}
<!----form start--->
                <form id="form" action="" method="POST">
                    {%  csrf_token %}
                    
     <!-------------------usernamedetails-->  
                    <div class="input_box">
                        <input type="text" name="First_name">
                        <label for="First_name">First Name</label>
                    </div>

    <!-------------------surname--> 
                    <div class="input_box">
                        <input type="text" name="Sur_name">
                        <label for="Sur_name">Last name</label>
                    </div>

    <!--------------------username-->              
                    <div class="input_box">
                        <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
                        <input type="text" name="username" >
                        <label for="username">Username</label>
                    </div>
    <!--------------------email-->   
    
                    
                    <div class="input_box">
                        <span class="icon"><ion-icon name="mail"></ion-icon></span>
                        <input type="email" name="email" required autocomplete="additional-name">
                        <label for="email">Email</label>
                    </div>
    <!-----------------password-->
                    <div class="input_box">
                        <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                        <input type="password" name="password" required>
                        <label for="password">Password</label>
                    </div>
    <!-----------------password2-->
                    
                    <div class="input_box">
                        <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                        <input type="password" name="password2" required>
                        <label for="password">Password</label>
                    </div>

                    <button type="submit" class="reg-is-btn">
                        register
                    </button>

    <!------------------already have account-->
                    <div class="regiter_btn"></div>
                    <p class="ask">
                        Already have an account?</p>
                        <a href="{% url 'auth:login' %}"
                        class="regester_btn">login</a> 
                    </div>                
                </form>
            </div>


            <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>



            <script src="{% static 'js/app.js' %}"></script>
    </body>
</html>
