{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ item.name }}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="item_card">
        <div class="item-title"><h1>{{item.name}}</h1></div>
        <div class="detail-image">
            <style>
                .item-title{
                    position: absolute;padding: 5px 20px;font-family: jayb;background-color:#e8f0f86b ;width: 100%;color: black;border-radius: 10px;
                }
                .detail-image{
                    display: grid;grid-template-columns: 500px 500px;border-bottom: 1px solid black;padding: 5%;
                }
                img{
                    width: 800px;height: 60vh;margin: 10px 0 0 0;padding: 5px;border-radius: 15px;
                }
                .other-details{
                    display: block;position: absolute;top: 115px; right: 5%;line-height: 20px;border-radius: 15px;background-color: #f2fdff;padding: 10px 20px;width: 800px;height: 58vh;
                }
            </style>
        <img src="{{ item.image.url }}" alt="{{ item.name }}"></div>
        <!------------------------------love--icon----------------------------------------->
        <div class="other-details"><span class="love-item"><ion-icon name="heart"></ion-icon></span>
        <p class="item_name">{{ item.name }}</p>
        <p class="item_description">Item Description: <br>{{ item.description }}</p>
        <div class="price_list"><h1>Ksh.</h1><h1 class="price">{{ item.price }}</h1></div>
        <div class="item_instock">In Stock: <br><h1>{{ item.in_stock }}</h1></div>
        <button class="pluscart">Add to Cart</button>
        <!--------------------------------iconstarchecked-------------------------------->
        <span class="rates"><ion-icon name="star"></ion-icon></span>
        <span class="rates"><ion-icon name="star"></ion-icon></span>
        <span class="rates"><ion-icon name="star"></ion-icon></span>
        <span class="rates"><ion-icon name="star"></ion-icon></span>
        <span class="rates"><ion-icon name="star-half-outline"></ion-icon></span></div>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
   
</body>
</html>
