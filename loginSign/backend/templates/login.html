{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>Maa Mara Market || register</title>
        <link rel="stylesheet" href="{% static 'style.css' %}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
       
    
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    </head>

    <body>
        
         <!-----------loging container------>  
         <div class="log_in_container">

            <div class="form-box login">
                <h2>login</h2>

                <style>
                    h5{color: red; font-family: jayb;}
                </style>

                {%  for message in messages %}
                <h5>{{message}}</h5>

                 {% endfor %}
<!----form start--->
                <form id="form" action="" method="POST">
                    {%  csrf_token %}
    <!--------------------email-->   
    
                    
                    <div class="input_box">
                        <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
                        <input type="text" name="username" required autocomplete="additional-name">
                        <label for="email">Username</label>
                    </div>
    <!-----------------password-->
                    <div class="input_box">
                        <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                        <input type="password" name="password" required>
                        <label for="password">Password</label>
                    </div>
    <!------------------remember/forget/password-->
                    <div class="rememnber-forgot">
                        <label for="checkbox">
                            <input type="checkbox" name="checkbox">Remember Me
                        </label>
                        <!----------forgot password-->
                        <a href="#">Forgot Password?</a>
    
                        <button type="submit" class="sign-in-btn">
                            Login
                        </button>
    
    <!------------dont have account/register--> 
                     <div class="regiter_btn"></div>
                     <p>
                        Don't have an account?</p>
                        <a href="{% url 'register' %}" class="reg_btn">register</a> 
                    </div>
                    
                </form></div>
            </div>


            <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>



            <script src="{% static 'js/app.js' %}"></script>
    </body>
</html>
