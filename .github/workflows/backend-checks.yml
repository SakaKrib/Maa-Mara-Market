name: Maa Mara Market backend checks

on:
  push:
    branches:
      - ui-redesign-foundation
    paths:
      - "maamara_market_project/backend/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "maamara_market_project/backend/**"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-checks:
    name: Django system checks, migrations, and fulfilment tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: maamara_ci
          POSTGRES_USER: maamara_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maamara_ci -d maamara_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: maamara_market_project/backend
    env:
      SECRET_KEY: "ci-only-not-a-production-secret"
      DEBUG: "true"
      FRONTEND_URL: "http://localhost:5173"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      POSTGRES_DB: "maamara_ci"
      POSTGRES_USER: "maamara_ci"
      POSTGRES_PASSWORD: "ci-only-password"
      POSTGRES_HOST: "127.0.0.1"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://127.0.0.1:6379/0"
      # Non-secret placeholders satisfy import-time settings in CI only.
      # Real payment/provider credentials remain in the deployment environment.
      MPESA_CONSUMER_KEY: "ci-placeholder"
      MPESA_CONSUMER_SECRET: "ci-placeholder"
      MPESA_AUTH_URL: "https://example.invalid/mpesa-auth"
      MPESA_URL: "https://example.invalid/mpesa"
      MPESA_B2B_URL: "https://example.invalid/mpesa-b2b"
      MPESA_B2B_RESULT_URL: "https://example.invalid/mpesa-b2b-result"
      MPESA_B2B_TIMEOUT_URL: "https://example.invalid/mpesa-b2b-timeout"
      MPESA_STK_URL: "https://example.invalid/mpesa-stk"
      PAYPAL_API_BASE: "https://example.invalid/paypal"
      PAYPAL_PAYOUT_URL: "https://example.invalid/paypal-payout"
      PAYPAL_AUTH_URL: "https://example.invalid/paypal-auth"
      PAYPAL_CLIENT_ID: "ci-placeholder"
      PAYPAL_CLIENT_SECRET: "ci-placeholder"
      KCB_API_BASE_URL: "https://example.invalid/kcb"
      KCB_OAUTH_URL: "https://example.invalid/kcb-auth"
      KCB_API_KEY: "ci-placeholder"
      KCB_API_SECRET: "ci-placeholder"
      KCB_CALLBACK_URL: "https://example.invalid/kcb-callback"
      EXCHANGE_RATE_API_URL: "https://example.invalid/exchange-rate"
      GEMINI_API_KEY: "ci-placeholder"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: maamara_market_project/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run Django system checks
        run: python manage.py check

      - name: Check model/migration consistency
        run: |
          set +e
          python manage.py makemigrations --check --dry-run -v 3 > /tmp/migration-check.txt 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            # Surface the pending changes as annotations so the drift is readable without log access.
            msg=$(head -c 5000 /tmp/migration-check.txt | tr '\n' '|' | sed 's/%/%25/g')
            echo "::error title=Migration drift::${msg:-no output}"
          fi
          exit $status

      - name: Apply all migrations to disposable PostgreSQL
        run: python manage.py migrate --noinput

      - name: Run fulfilment tracking regression tests
        run: |
          set +e
          python manage.py test order.test_fulfillment_tracking vendorDashboard.tests.test_payout_guard vendorDashboard.tests.test_payout_reconciliation vendorDashboard.tests.test_weekly_payouts --verbosity 2 > /tmp/fulfilment-tests.txt 2>&1
          status=$?
          cat /tmp/fulfilment-tests.txt
          if [ "$status" -ne 0 ]; then
            # Failures are also published as annotations so they can be read without log access.
            grep -E "^(ERROR|FAIL):|Error|Exception|assert|Traceback|File \"/home/runner/work/.*(order|vendor|pesapal)" /tmp/fulfilment-tests.txt | head -c 5000 | tr '\n' '|' | sed 's/%/%25/g' > /tmp/fulfilment-summary.txt
            echo "::error title=Fulfilment test failures::$(cat /tmp/fulfilment-summary.txt)"
          fi
          exit $status
