name: Maa Mara Market backend checks

on:
  push:
    branches:
      - ui-redesign-foundation
    paths:
      - "maamara_market_project/backend/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "maamara_market_project/backend/**"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-checks:
    name: Django system checks and Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: maamara_market_project/backend
    env:
      SECRET_KEY: "ci-only-not-a-production-secret"
      DEBUG: "true"
      FRONTEND_URL: "http://localhost:5173"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      POSTGRES_DB: "maamara_ci"
      POSTGRES_USER: "maamara_ci"
      POSTGRES_PASSWORD: "ci-only-password"
      POSTGRES_HOST: "127.0.0.1"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://127.0.0.1:6379/0"
      # Non-secret placeholders satisfy import-time settings in CI only.
      # Real payment/provider credentials remain in the deployment environment.
      MPESA_CONSUMER_KEY: "ci-placeholder"
      MPESA_CONSUMER_SECRET: "ci-placeholder"
      MPESA_AUTH_URL: "https://example.invalid/mpesa-auth"
      MPESA_URL: "https://example.invalid/mpesa"
      MPESA_STK_URL: "https://example.invalid/mpesa-stk"
      PAYPAL_API_BASE: "https://example.invalid/paypal"
      PAYPAL_PAYOUT_URL: "https://example.invalid/paypal-payout"
      PAYPAL_AUTH_URL: "https://example.invalid/paypal-auth"
      PAYPAL_CLIENT_ID: "ci-placeholder"
      PAYPAL_CLIENT_SECRET: "ci-placeholder"
      KCB_API_BASE_URL: "https://example.invalid/kcb"
      KCB_OAUTH_URL: "https://example.invalid/kcb-auth"
      KCB_API_KEY: "ci-placeholder"
      KCB_API_SECRET: "ci-placeholder"
      KCB_CALLBACK_URL: "https://example.invalid/kcb-callback"
      EXCHANGE_RATE_API_URL: "https://example.invalid/exchange-rate"
      GEMINI_API_KEY: "ci-placeholder"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: maamara_market_project/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run Django system checks
        run: python manage.py check
