name: Maa Mara Market backend checks

on:
  push:
    branches:
      - ui-redesign-foundation
    paths:
      - "maamara_market_project/backend/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "maamara_market_project/backend/**"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-checks:
    name: Django system checks and Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: maamara_market_project/backend
    env:
      SECRET_KEY: "ci-only-not-a-production-secret"
      DEBUG: "true"
      FRONTEND_URL: "http://localhost:5173"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      POSTGRES_DB: "maamara_ci"
      POSTGRES_USER: "maamara_ci"
      POSTGRES_PASSWORD: "ci-only-password"
      POSTGRES_HOST: "127.0.0.1"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://127.0.0.1:6379/0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: maamara_market_project/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run Django system checks
        run: python manage.py check
