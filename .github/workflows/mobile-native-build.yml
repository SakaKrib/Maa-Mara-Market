name: Maa Mara Market native app build

on:
  push:
    branches:
      - ui-redesign-foundation
    paths:
      - "maamara_market_project/frontend/**"
      - ".github/workflows/mobile-native-build.yml"
  workflow_dispatch:
    inputs:
      api_url:
        description: "API origin for this development build. Use the Tailscale backend for testing; use https://maamaramarket.com explicitly for a public production build."
        required: true
        type: string
        default: "https://opondo-thinkpad-t14-gen-1.tail34bca9.ts.net"

permissions:
  contents: read

concurrency:
  group: mobile-native-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FRONTEND_DIR: maamara_market_project/frontend
  MOBILE_API_URL: ${{ github.event.inputs.api_url || 'https://opondo-thinkpad-t14-gen-1.tail34bca9.ts.net' }}

jobs:

  frontend-checks:
    name: Website/mobile frontend build and sharing lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maamara_market_project/frontend/package-lock.json

      - name: Install web dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build website bundle
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Build mobile web bundle
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VITE_BUILD_TARGET: mobile
          VITE_API_URL: ${{ env.MOBILE_API_URL }}
          VITE_PUBLIC_SITE_URL: https://maamaramarket.com
        run: npm run build:mobile

      - name: Lint product sharing module
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npx eslint src/Services/ProductSharing.js

  android:
    name: Generate and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maamara_market_project/frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Install temporary Capacitor build tools
        working-directory: ${{ env.FRONTEND_DIR }}
        # Runtime plugins (including push notifications) are pinned in package.json and the lockfile.
        # Install project generators/platform wrappers and Status Bar temporarily.
        run: npm install --no-save @capacitor/cli@7 @capacitor/android@7 @capacitor/ios@7 @capacitor/status-bar@7 typescript@5.8.3

      - name: Build mobile web bundle
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VITE_BUILD_TARGET: mobile
          VITE_API_URL: ${{ env.MOBILE_API_URL }}
          VITE_NATIVE_PUSH_ENABLED: ${{ secrets.FIREBASE_ANDROID_CONFIG != '' }}
        run: npm run build:mobile

      - name: Generate Android project and configure Firebase when credentials are available
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: |
          npx cap add android
          if [ -n "$FIREBASE_ANDROID_CONFIG" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG" > android/app/google-services.json
            python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("android/app/google-services.json").read_text())
          package_names = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          }
          expected_package = "com.maamaramarket.app"
          if expected_package not in package_names:
              raise SystemExit(
                  f"Firebase Android config does not contain {expected_package}; "
                  f"found: {sorted(name for name in package_names if name)}"
              )

          root_gradle = Path("android/build.gradle")
          root_text = root_gradle.read_text()
          google_classpath = "classpath 'com.google.gms:google-services:4.4.2'"
          if google_classpath not in root_text:
              root_text = root_text.replace(
                  "dependencies {",
                  "dependencies {\n        " + google_classpath,
                  1,
              )
              root_gradle.write_text(root_text)

          app_gradle = Path("android/app/build.gradle")
          app_text = app_gradle.read_text()
          if "com.google.gms.google-services" not in app_text:
              app_gradle.write_text(app_text.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n")
          PY
          else
            echo "Firebase Android config missing; this APK will build, but native push registration stays disabled."
          fi
          npx cap sync android

      - name: Install Maa Mara Market status-bar notification icon
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_maamara.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="96"
              android:viewportHeight="48">
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#FFFFFFFF"
                  android:strokeWidth="4.5"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M12,36 V20 C12,10 24,10 24,20 V36 C24,10 36,10 36,20 V36 C36,10 48,10 48,20 V36 C48,10 60,10 60,20 V36 C60,10 72,10 72,20 V36 C72,10 84,10 84,20 V36" />
          </vector>
          XML
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          metadata = '<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_maamara" />'
          pattern = r'<meta-data\s+android:name="com\.google\.firebase\.messaging\.default_notification_icon"[^>]*/>'
          if re.search(pattern, source):
              source = re.sub(pattern, metadata, source, count=1)
          else:
              source, count = re.subn(
                  r'<application\b[^>]*>',
                  lambda match: match.group(0) + '\n        ' + metadata,
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not locate the Android application element in AndroidManifest.xml")
          manifest.write_text(source)
          ET.parse(manifest)
          ET.parse("android/app/src/main/res/drawable/ic_stat_maamara.xml")
          if '@drawable/ic_stat_maamara' not in manifest.read_text():
              raise SystemExit("Notification icon metadata was not installed")
          print("Validated lowercase triple-m Android notification icon.")
          PY

      # GitHub development builds use HTTPS Tailscale Serve to avoid Android WebView mixed-content blocking.
      # Use https://maamaramarket.com only for an explicitly requested production build.
      - name: Allow HTTP API access only when explicitly configured
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          MOBILE_API_URL: ${{ env.MOBILE_API_URL }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          if not os.environ["MOBILE_API_URL"].lower().startswith("http://"):
              print("HTTPS API configured; no cleartext manifest change needed.")
              raise SystemExit(0)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if re.search(r"android:usesCleartextTraffic\s*=", text):
              text = re.sub(
                  r'android:usesCleartextTraffic\s*=\s*"[^"]*"',
                  'android:usesCleartextTraffic="true"',
                  text,
                  count=1,
              )
          else:
              text, count = re.subn(
                  r"<application\b",
                  '<application android:usesCleartextTraffic="true"',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not locate the application tag in AndroidManifest.xml")
          manifest.write_text(text)
          print("Enabled HTTP requests for the configured Tailscale API origin.")
          PY

      # Capacitor creates the native project on every run, so enforce the
      # edge-to-edge system-bar behavior in the generated activity before compiling.
      - name: Keep Android system bars visible with full-screen content
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          cat > android/app/src/main/java/com/maamaramarket/app/MainActivity.java <<'JAVA'
          package com.maamaramarket.app;

          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.WebView;
          import android.widget.Toast;

          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static final long BACK_EXIT_INTERVAL_MS = 2000L;
              private long lastHomeBackPressAt = 0L;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // The API is cross-site from https://localhost. Android WebView
                  // must explicitly accept third-party cookies for JWT refresh/login.
                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  WebView webView = bridge != null ? bridge.getWebView() : null;
                  if (webView != null) {
                      cookieManager.setAcceptThirdPartyCookies(webView, true);
                  }
                  applySystemBarSettings();
                  // Reapply after Capacitor plugins initialize.
                  getWindow().getDecorView().post(this::applySystemBarSettings);
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  WebView webView = bridge != null ? bridge.getWebView() : null;
                  if (webView != null) {
                      String currentUrl = webView.getUrl();
                      String currentPath = currentUrl == null ? "/" : Uri.parse(currentUrl).getPath();
                      boolean isHome = currentPath == null
                          || currentPath.isEmpty()
                          || "/".equals(currentPath)
                          || "/index.html".equals(currentPath);

                      // React Router uses the WebView's browser history. On
                      // any non-home route, Back should navigate within the app.
                      if (!isHome) {
                          lastHomeBackPressAt = 0L;
                          if (webView.canGoBack()) {
                              webView.goBack();
                          } else {
                              webView.evaluateJavascript(
                                  "window.history.length > 1 ? window.history.back() : window.location.assign('/')",
                                  null
                              );
                          }
                          return;
                      }
                  }

                  long now = SystemClock.elapsedRealtime();
                  if (now - lastHomeBackPressAt <= BACK_EXIT_INTERVAL_MS && lastHomeBackPressAt != 0L) {
                      finish();
                      return;
                  }

                  lastHomeBackPressAt = now;
                  Toast.makeText(this, "Press back again to exit", Toast.LENGTH_SHORT).show();
              }

              private void applySystemBarSettings() {
                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);

                  // Draw edge-to-edge on all supported Android versions so there
                  // is no artificial gap between the status bar and app content.
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);

                  WindowInsetsControllerCompat controller =
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  controller.show(WindowInsetsCompat.Type.statusBars());
                  controller.show(WindowInsetsCompat.Type.navigationBars());
                  controller.setAppearanceLightStatusBars(true);
                  controller.setAppearanceLightNavigationBars(true);
                  // Use a true white surface for both Android system-bar areas.
                  // With edge-to-edge enabled, these views also provide the
                  // background visible behind the transparent system bars.
                  getWindow().setStatusBarColor(Color.WHITE);
                  getWindow().setNavigationBarColor(Color.WHITE);
                  getWindow().getDecorView().setBackgroundColor(Color.WHITE);
                  if (Build.VERSION.SDK_INT >= 29) {
                      getWindow().setNavigationBarContrastEnforced(false);
                  }

                  // Explicitly clear top, bottom, and side inset padding so the
                  // WebView uses the full screen height and width.
                  View content = findViewById(android.R.id.content);
                  if (content != null) {
                      content.setBackgroundColor(Color.WHITE);
                      ViewCompat.setOnApplyWindowInsetsListener(content, (view, insets) -> {
                          view.setPadding(0, 0, 0, 0);
                          return insets;
                      });
                      ViewCompat.requestApplyInsets(content);
                  }
                  WebView activeWebView = bridge != null ? bridge.getWebView() : null;
                  if (activeWebView != null) {
                      activeWebView.setBackgroundColor(Color.WHITE);
                  }
              }
          }
          JAVA

      - name: Build Android debug APK
        working-directory: ${{ env.FRONTEND_DIR }}/android
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: maa-mara-market-android-debug
          path: ${{ env.FRONTEND_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated Android project
        uses: actions/upload-artifact@v4
        with:
          name: maa-mara-market-android-project
          path: ${{ env.FRONTEND_DIR }}/android/
          if-no-files-found: error
          retention-days: 14

  ios-project:
    name: Generate and compile iOS project
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maamara_market_project/frontend/package-lock.json

      - name: Install web dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Install temporary Capacitor build tools
        working-directory: ${{ env.FRONTEND_DIR }}
        # Runtime plugins (including push notifications) are pinned in package.json and the lockfile.
        # Install project generators/platform wrappers and Status Bar temporarily.
        run: npm install --no-save @capacitor/cli@7 @capacitor/android@7 @capacitor/ios@7 @capacitor/status-bar@7 typescript@5.8.3

      - name: Build mobile web bundle
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VITE_BUILD_TARGET: mobile
          VITE_API_URL: ${{ env.MOBILE_API_URL }}
          VITE_NATIVE_PUSH_ENABLED: ${{ secrets.FIREBASE_IOS_CONFIG != '' }}
        run: npm run build:mobile

      - name: Generate iOS project and configure Firebase when credentials are available
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          FIREBASE_IOS_CONFIG: ${{ secrets.FIREBASE_IOS_CONFIG }}
        run: |
          npx cap add ios
          if [ -n "$FIREBASE_IOS_CONFIG" ]; then
            printf '%s' "$FIREBASE_IOS_CONFIG" > ios/App/App/GoogleService-Info.plist
            python3 - <<'PY'
          import plistlib
          from pathlib import Path

          config = plistlib.loads(Path("ios/App/App/GoogleService-Info.plist").read_bytes())
          expected_bundle = "com.maamaramarket.app"
          actual_bundle = config.get("BUNDLE_ID")
          if actual_bundle != expected_bundle:
              raise SystemExit(
                  f"Firebase iOS config BUNDLE_ID must be {expected_bundle}; got {actual_bundle!r}"
              )
          PY
            ruby - <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.find { |entry| entry.name == 'App' }
          raise 'App target was not found in the generated Xcode project' unless target
          app_group = project.main_group.find_subpath('App', false)
          raise 'App group was not found in the generated Xcode project' unless app_group
          file_ref = app_group.files.find { |file| file.path == 'GoogleService-Info.plist' }
          file_ref ||= app_group.new_file('GoogleService-Info.plist')
          unless target.resources_build_phase.files_references.include?(file_ref)
            target.resources_build_phase.add_file_reference(file_ref)
          end
          project.save
          RUBY
          else
            echo "Firebase iOS config missing; this simulator build will not register for native push."
          fi

          python3 - <<'PY'
          from pathlib import Path

          app_delegate = Path("ios/App/App/AppDelegate.swift")
          source = app_delegate.read_text()
          if "capacitorDidRegisterForRemoteNotifications" not in source:
              methods = """
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          """
              closing = source.rfind("}")
              if closing < 0:
                  raise SystemExit("Could not locate AppDelegate class closing brace")
              source = source[:closing] + methods + source[closing:]
              app_delegate.write_text(source)
          PY
          npx cap sync ios

      # iOS displays the app icon for notifications; unlike Android, it has no separate
      # custom monochrome status-bar notification icon. Brand the app icon with the same mmm mark.
      - name: Apply Maa Mara Market triple-m monogram to iOS app icon
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
          cat > /tmp/generate-maamara-icon.swift <<'SWIFT'
          import AppKit
          import Foundation

          let size = 1024
          let bitmap = NSBitmapImageRep(
              bitmapDataPlanes: nil,
              pixelsWide: size,
              pixelsHigh: size,
              bitsPerSample: 8,
              samplesPerPixel: 4,
              hasAlpha: true,
              isPlanar: false,
              colorSpaceName: .deviceRGB,
              bytesPerRow: 0,
              bitsPerPixel: 0
          )!
          NSGraphicsContext.saveGraphicsState()
          NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: bitmap)
          NSGraphicsContext.current?.imageInterpolation = .high

          NSColor(calibratedRed: 23 / 255, green: 60 / 255, blue: 118 / 255, alpha: 1).setFill()
          NSBezierPath(rect: NSRect(x: 0, y: 0, width: size, height: size)).fill()

          NSColor.white.setStroke()
          let monogram = NSBezierPath()
          monogram.lineWidth = 38
          monogram.lineCapStyle = .round
          monogram.lineJoinStyle = .round
          let baseline: CGFloat = 330
          let top: CGFloat = 570
          for letter in 0..<3 {
              let x = CGFloat(130 + letter * 260)
              monogram.move(to: NSPoint(x: x, y: baseline))
              monogram.line(to: NSPoint(x: x, y: top))
              monogram.curve(
                  to: NSPoint(x: x + 130, y: top),
                  controlPoint1: NSPoint(x: x, y: top + 105),
                  controlPoint2: NSPoint(x: x + 130, y: top + 105)
              )
              monogram.line(to: NSPoint(x: x + 130, y: baseline))
              monogram.line(to: NSPoint(x: x + 130, y: top))
              monogram.curve(
                  to: NSPoint(x: x + 260, y: top),
                  controlPoint1: NSPoint(x: x + 130, y: top + 105),
                  controlPoint2: NSPoint(x: x + 260, y: top + 105)
              )
              monogram.line(to: NSPoint(x: x + 260, y: baseline))
          }
          monogram.stroke()
          NSGraphicsContext.restoreGraphicsState()

          let output = "ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          let png = bitmap.representation(using: .png, properties: [:])!
          try png.write(to: URL(fileURLWithPath: output))
          print("Generated the iOS Maa Mara Market triple-m app icon using built-in macOS graphics.")
          SWIFT
          swift /tmp/generate-maamara-icon.swift
          python3 - <<'PY'
          import json
          from pathlib import Path

          icon_dir = Path("ios/App/App/Assets.xcassets/AppIcon.appiconset")
          icon_path = icon_dir / "AppIcon-1024.png"
          if not icon_path.is_file() or icon_path.stat().st_size < 1000:
              raise SystemExit("The iOS app icon image was not generated correctly.")
          (icon_dir / "Contents.json").write_text(json.dumps({
              "images": [{
                  "filename": "AppIcon-1024.png",
                  "idiom": "universal",
                  "platform": "ios",
                  "size": "1024x1024"
              }],
              "info": {"author": "xcode", "version": 1}
          }, indent=2) + "\\n")
          print("Validated iOS app icon asset catalog.")
          PY

      - name: Apply Maa Mara Market triple-m app icon for iOS notifications
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          python3 -m venv /tmp/maamara-icon-venv
          /tmp/maamara-icon-venv/bin/pip install --quiet cairosvg
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          svg = """<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <rect width="1024" height="1024" fill="#173C76"/>
            <path d="M145 675 V430 C145 300 275 300 275 430 V675 M275 430 C275 300 405 300 405 430 V675
                     M335 675 V430 C335 300 465 300 465 430 V675 M465 430 C465 300 595 300 595 430 V675
                     M525 675 V430 C525 300 655 300 655 430 V675 M655 430 C655 300 785 300 785 430 V675
"
                  fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>"""
          icon_dir = Path("ios/App/App/Assets.xcassets/AppIcon.appiconset")
          icon_dir.mkdir(parents=True, exist_ok=True)
          svg_path = Path("/tmp/maamara-app-icon.svg")
          png_path = icon_dir / "AppIcon-1024.png"
          svg_path.write_text(svg)
          subprocess.run([
              "/tmp/maamara-icon-venv/bin/python", "-c",
              "import cairosvg,sys; cairosvg.svg2png(url=sys.argv[1],write_to=sys.argv[2],output_width=1024,output_height=1024)",
              str(svg_path), str(png_path)
          ], check=True)
          (icon_dir / "Contents.json").write_text(json.dumps({
              "images": [{
                  "filename": "AppIcon-1024.png",
                  "idiom": "universal",
                  "platform": "ios",
                  "size": "1024x1024"
              }],
              "info": {"author": "xcode", "version": 1}
          }, indent=2) + "\\n")
          print("Generated the navy-background, white outline triple-m iOS app icon. iOS uses this app icon in notification banners and the notification center; it does not show a separate small notification icon beside the clock.")
          PY

      - name: Build iOS simulator app
        working-directory: ${{ env.FRONTEND_DIR }}/ios
        run: xcodebuild -workspace App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Package generated iOS project
        working-directory: ${{ env.FRONTEND_DIR }}
        run: zip -qr maa-mara-market-ios-project.zip ios

      - name: Upload generated iOS project
        uses: actions/upload-artifact@v4
        with:
          name: maa-mara-market-ios-project
          path: ${{ env.FRONTEND_DIR }}/maa-mara-market-ios-project.zip
          if-no-files-found: error
          retention-days: 14
