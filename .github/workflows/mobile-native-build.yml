name: Maa Mara Market Signed Android Release + iOS Build

on:
  push:
    branches:
      - ui-redesign-foundation
    paths:
      - "maamara_market_project/frontend/**"
      - "maamara_market_project/backend/**"
      - ".github/workflows/mobile-native-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-native-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FRONTEND_DIR: maamara_market_project/frontend
  # Public hostname comes from one secret; the optional path variable selects
  # /maamara for shared-hostname testing or / for a standalone production domain.
  MOBILE_API_URL: ${{ secrets.MAAMARAMARKET_PUBLIC_BASE_URL }}
  # Set repository variable MAAMARAMARKET_PUBLIC_PATH_PREFIX to / for root-domain production.
  MOBILE_API_PATH_PREFIX: ${{ vars.MAAMARAMARKET_PUBLIC_PATH_PREFIX || '/maamara' }}

jobs:

  frontend-checks:
    name: Website/mobile frontend build and sharing lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maamara_market_project/frontend/package-lock.json

      - name: Install web dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Generate Android App Links verification file
        env:
          ANDROID_APP_SHA256_CERT_FINGERPRINTS: ${{ secrets.ANDROID_APP_SHA256_CERT_FINGERPRINTS || vars.ANDROID_APP_SHA256_CERT_FINGERPRINTS }}
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          raw = os.environ.get("ANDROID_APP_SHA256_CERT_FINGERPRINTS", "").strip()
          fingerprints = [item.strip().upper() for item in raw.split(",") if item.strip()]
          pattern = re.compile(r"^(?:[0-9A-F]{2}:){31}[0-9A-F]{2}$")
          if not fingerprints or any(not pattern.fullmatch(item) for item in fingerprints):
              raise SystemExit(
                  "::error::ANDROID_APP_SHA256_CERT_FINGERPRINTS must contain one or more "
                  "colon-separated SHA-256 certificate fingerprints."
              )
          if len(set(fingerprints)) != len(fingerprints):
              raise SystemExit("Duplicate Android signing fingerprints were supplied.")

          destination = Path("public/.well-known/assetlinks.json")
          destination.parent.mkdir(parents=True, exist_ok=True)
          payload = [{
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                  "namespace": "android_app",
                  "package_name": "com.maamaramarket.app",
                  "sha256_cert_fingerprints": fingerprints,
              },
          }]
          destination.write_text(json.dumps(payload, indent=2) + "\\n")
          print(f"Generated Android App Links association for {len(fingerprints)} signing certificate(s).")
          PY

      - name: Build website bundle
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VITE_PUBLIC_BASE_PATH: ${{ vars.MAAMARAMARKET_PUBLIC_PATH_PREFIX == '/' && '/' || format('{0}/', vars.MAAMARAMARKET_PUBLIC_PATH_PREFIX || '/maamara') }}
          VITE_ROUTER_BASENAME: ${{ vars.MAAMARAMARKET_PUBLIC_PATH_PREFIX || '/maamara' }}
        run: npm run build

      - name: Build mobile web bundle
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VITE_BUILD_TARGET: mobile
          VITE_API_URL: ${{ env.MOBILE_API_URL }}${{ env.MOBILE_API_PATH_PREFIX }}
          VITE_ROUTER_BASENAME: /
          VITE_PUBLIC_SITE_URL: https://maamaramarket.com
        run: npm run build:mobile

      - name: Upload Android App Links website file
        uses: actions/upload-artifact@v4
        with:
          name: maa-mara-market-assetlinks
          path: ${{ env.FRONTEND_DIR }}/public/.well-known/assetlinks.json
          if-no-files-found: error
          retention-days: 30

      - name: Lint product sharing module
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npx eslint src/Services/ProductSharing.js

  android:
    name: Generate and sign Android release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maamara_market_project/frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Require Firebase Android client config for push-enabled APK
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: |
          if [ -z "$FIREBASE_ANDROID_CONFIG" ]; then
            echo "::error::FIREBASE_ANDROID_CONFIG is missing; set the FIREBASE_ANDROID_CONFIG secret to build a push-enabled APK."
            exit 1
          fi

      - name: Install temporary Capacitor build tools
        working-directory: ${{ env.FRONTEND_DIR }}
        # Runtime plugins (including push notifications) are pinned in package.json and the lockfile.
        # Install project generators/platform wrappers and Status Bar temporarily.
        run: npm install --no-save @capacitor/cli@7 @capacitor/android@7 @capacitor/ios@7 @capacitor/status-bar@7 @capacitor/app@7 typescript@5.8.3 sharp

      - name: Validate configured mobile API base URL
        env:
          MOBILE_API_URL: ${{ env.MOBILE_API_URL }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ.get("MOBILE_API_URL", "").strip()
          parsed = urlparse(value)
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit(
                  "::error::Set MAAMARAMARKET_PUBLIC_BASE_URL to the HTTPS API origin "
                  "(Tailscale Funnel for development or https://maamaramarket.com for production)."
              )
          if parsed.path not in ("", "/") or parsed.query or parsed.fragment:
              raise SystemExit("MAAMARAMARKET_PUBLIC_BASE_URL must be an origin only, without a path, query or fragment.")
          print("Validated the HTTPS mobile API origin.")
          PY

      - name: Build mobile web bundle
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VITE_BUILD_TARGET: mobile
          VITE_API_URL: ${{ env.MOBILE_API_URL }}${{ env.MOBILE_API_PATH_PREFIX }}
          VITE_ROUTER_BASENAME: /
          VITE_NATIVE_PUSH_ENABLED: ${{ secrets.FIREBASE_ANDROID_CONFIG != '' }}
        run: npm run build:mobile

      - name: Generate Android project and configure Firebase when credentials are available
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
          ANDROID_APP_SHA256_CERT_FINGERPRINTS: ${{ secrets.ANDROID_APP_SHA256_CERT_FINGERPRINTS || vars.ANDROID_APP_SHA256_CERT_FINGERPRINTS }}
        run: |
          npx cap add android
          if [ -n "$FIREBASE_ANDROID_CONFIG" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG" > android/app/google-services.json
            python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("android/app/google-services.json").read_text())
          package_names = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          }
          expected_package = "com.maamaramarket.app"
          if expected_package not in package_names:
              raise SystemExit(
                  f"Firebase Android config does not contain {expected_package}; "
                  f"found: {sorted(name for name in package_names if name)}"
              )

          root_gradle = Path("android/build.gradle")
          root_text = root_gradle.read_text()
          google_classpath = "classpath 'com.google.gms:google-services:4.4.2'"
          if google_classpath not in root_text:
              root_text = root_text.replace(
                  "dependencies {",
                  "dependencies {\n        " + google_classpath,
                  1,
              )
              root_gradle.write_text(root_text)

          app_gradle = Path("android/app/build.gradle")
          app_text = app_gradle.read_text()
          if "com.google.gms.google-services" not in app_text:
              app_gradle.write_text(app_text.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n")
          PY
          else
            echo "Firebase Android config missing; this APK will build, but native push registration stays disabled."
          fi
          npx cap sync android
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          raw = os.environ.get("ANDROID_APP_SHA256_CERT_FINGERPRINTS", "").strip()
          fingerprints = [item.strip().upper() for item in raw.split(",") if item.strip()]
          fingerprint_pattern = re.compile(r"^(?:[0-9A-F]{2}:){31}[0-9A-F]{2}$")
          if not fingerprints or any(not fingerprint_pattern.fullmatch(item) for item in fingerprints):
              raise SystemExit("ANDROID_APP_SHA256_CERT_FINGERPRINTS is missing or malformed.")

          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          android = "{http://schemas.android.com/apk/res/android}"
          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest_path)
          application = tree.getroot().find("application")
          if application is None:
              raise SystemExit("Android manifest has no application element.")

          launcher = None
          for activity in application.findall("activity"):
              actions = {
                  action.get(android + "name")
                  for intent in activity.findall("intent-filter")
                  for action in intent.findall("action")
              }
              if "android.intent.action.MAIN" in actions:
                  launcher = activity
                  break
          if launcher is None:
              raise SystemExit("Could not locate the Android launcher activity.")

          for intent in launcher.findall("intent-filter"):
              if intent.get(android + "autoVerify") == "true" and any(
                  data.get(android + "host") == "maamaramarket.com"
                  for data in intent.findall("data")
              ):
                  print("Android App Links intent filter already exists.")
                  break
          else:
              intent = ET.SubElement(launcher, "intent-filter", {android + "autoVerify": "true"})
              ET.SubElement(intent, "action", {android + "name": "android.intent.action.VIEW"})
              ET.SubElement(intent, "category", {android + "name": "android.intent.category.DEFAULT"})
              ET.SubElement(intent, "category", {android + "name": "android.intent.category.BROWSABLE"})
              ET.SubElement(intent, "data", {
                  android + "scheme": "https",
                  android + "host": "maamaramarket.com",
              })
          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)
          ET.parse(manifest_path)
          print("Configured verified HTTPS App Links for https://maamaramarket.com.")
          PY

      - name: Remove duplicate Android launcher background resource
        working-directory: ${{ env.FRONTEND_DIR }}
        run: rm -f android/app/src/main/res/values/ic_launcher_background.xml

      - name: Generate MaaMara Market Android launcher icon
        working-directory: ${{ env.FRONTEND_DIR }}
        run: node scripts/generate-native-app-icons.mjs android

      - name: Explicitly bind generated launcher icons in AndroidManifest.xml
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          android_ns = "{http://schemas.android.com/apk/res/android}"
          # Preserve the required android: prefix when ElementTree serializes the manifest.
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          application = tree.getroot().find("application")
          if application is None:
              raise SystemExit("AndroidManifest.xml has no application element")

          # Do not rely on Capacitor's generated defaults: explicitly point the
          # installed app and launcher to the Maa Mara resources generated above.
          application.set(android_ns + "icon", "@mipmap/ic_launcher")
          application.set(android_ns + "roundIcon", "@mipmap/ic_launcher_round")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          res = Path("android/app/src/main/res")
          for density in ("mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"):
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  icon = res / f"mipmap-{density}" / name
                  if not icon.is_file() or icon.stat().st_size == 0:
                      raise SystemExit(f"Missing generated launcher icon: {icon}")

          for icon in (
              res / "mipmap-anydpi-v26/ic_launcher.xml",
              res / "mipmap-anydpi-v26/ic_launcher_round.xml",
              res / "drawable/maamara_launcher_foreground.png",
          ):
              if not icon.is_file() or icon.stat().st_size == 0:
                  raise SystemExit(f"Missing adaptive launcher icon resource: {icon}")

          checked = ET.parse(manifest).getroot().find("application")
          if checked.get(android_ns + "icon") != "@mipmap/ic_launcher":
              raise SystemExit("Manifest launcher icon does not reference @mipmap/ic_launcher")
          if checked.get(android_ns + "roundIcon") != "@mipmap/ic_launcher_round":
              raise SystemExit("Manifest round launcher icon does not reference @mipmap/ic_launcher_round")
          print("Validated AndroidManifest.xml launcher references and generated Maa Mara icon resources.")
          PY

      - name: Generate and validate the iOS app icon asset
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          node scripts/generate-native-app-icons.mjs ios
          node --input-type=module <<'JS'
          import fs from "node:fs/promises";
          import sharp from "sharp";

          const iconPath = "ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png";
          const metadata = await sharp(iconPath).metadata();
          if (metadata.width !== 1024 || metadata.height !== 1024) {
            throw new Error(`iOS app icon must be 1024x1024; got ${metadata.width}x${metadata.height}`);
          }
          const catalog = JSON.parse(await fs.readFile(
            "ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json",
            "utf8"
          ));
          if (!catalog.images?.some((image) => image.filename === "AppIcon-1024.png")) {
            throw new Error("iOS AppIcon Contents.json does not reference AppIcon-1024.png");
          }
          console.log("Validated the generated 1024x1024 iOS app icon and asset catalog.");
          JS

      - name: Configure Firebase default notification icon
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          test -s android/app/src/main/res/drawable/ic_stat_maamara.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          metadata = '<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_maamara" />'
          metadata_name = 'android:name="com.google.firebase.messaging.default_notification_icon"'
          if metadata_name in source:
              pattern = re.compile(r'<meta-data\b(?=[^>]*android:name="com\.google\.firebase\.messaging\.default_notification_icon")[^>]*/>')
              source, count = pattern.subn(metadata, source, count=1)
              if count != 1:
                  raise SystemExit("Could not safely update the existing Firebase notification icon metadata")
          else:
              app_start = source.find("<application")
              app_end = source.find(">", app_start)
              if app_start < 0 or app_end < 0:
                  raise SystemExit("Could not locate the Android application element in AndroidManifest.xml")
              source = source[:app_end + 1] + "\n        " + metadata + source[app_end + 1:]
          manifest.write_text(source)

          ET.parse(manifest)
          icon = ET.parse("android/app/src/main/res/drawable/ic_stat_maamara.xml").getroot()
          if metadata_name not in manifest.read_text() or "@drawable/ic_stat_maamara" not in manifest.read_text():
              raise SystemExit("Firebase notification icon metadata was not installed")
          paths = icon.findall("path")
          if len(paths) != 2:
              raise SystemExit("Option B notification icon must contain exactly two paths: accent bar and M tile")
          if any(path.get("{http://schemas.android.com/apk/res/android}strokeColor") for path in paths):
              raise SystemExit("Option B notification icon must use solid shapes without outlines")
          print("Validated the Option B monochrome M tile + accent bar and Firebase default icon metadata.")
          PY

      # GitHub development builds use HTTPS Tailscale Serve to avoid Android WebView mixed-content blocking.
      # Use https://maamaramarket.com only for an explicitly requested production build.
      - name: Allow HTTP API access only when explicitly configured
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          MOBILE_API_URL: ${{ env.MOBILE_API_URL }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          if not os.environ["MOBILE_API_URL"].lower().startswith("http://"):
              print("HTTPS API configured; no cleartext manifest change needed.")
              raise SystemExit(0)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if re.search(r"android:usesCleartextTraffic\s*=", text):
              text = re.sub(
                  r'android:usesCleartextTraffic\s*=\s*"[^"]*"',
                  'android:usesCleartextTraffic="true"',
                  text,
                  count=1,
              )
          else:
              text, count = re.subn(
                  r"<application\b",
                  '<application android:usesCleartextTraffic="true"',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not locate the application tag in AndroidManifest.xml")
          manifest.write_text(text)
          print("Enabled HTTP requests for the configured Tailscale API origin.")
          PY

      # Capacitor creates the native project on every run, so enforce the
      # edge-to-edge system-bar behavior in the generated activity before compiling.
      - name: Keep Android system bars visible with full-screen content
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          cat > android/app/src/main/java/com/maamaramarket/app/MainActivity.java <<'JAVA'
          package com.maamaramarket.app;

          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.WebView;
          import android.widget.Toast;

          import androidx.activity.OnBackPressedCallback;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static final long BACK_EXIT_INTERVAL_MS = 2000L;
              private long lastHomeBackPressAt = 0L;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          WebView webView = bridge != null ? bridge.getWebView() : null;
                          // Let WebView/React Router history handle Back before considering app exit.
                          if (webView != null && webView.canGoBack()) {
                              webView.goBack();
                              lastHomeBackPressAt = 0L;
                              return;
                          }

                          long now = SystemClock.elapsedRealtime();
                          if (lastHomeBackPressAt > 0L && now - lastHomeBackPressAt <= BACK_EXIT_INTERVAL_MS) {
                              lastHomeBackPressAt = 0L;
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                              return;
                          }

                          lastHomeBackPressAt = now;
                          Toast.makeText(MainActivity.this, "Press Back again to exit Maa Mara Market", Toast.LENGTH_SHORT).show();
                      }
                  });
                  // The API is cross-site from https://localhost. Android WebView
                  // must explicitly accept third-party cookies for JWT refresh/login.
                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  WebView webView = bridge != null ? bridge.getWebView() : null;
                  if (webView != null) {
                      cookieManager.setAcceptThirdPartyCookies(webView, true);
                  }
                  applySystemBarSettings();
                  // Reapply after Capacitor plugins initialize.
                  getWindow().getDecorView().post(this::applySystemBarSettings);
              }

              private void applySystemBarSettings() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  getWindow().setStatusBarColor(Color.TRANSPARENT);
                  getWindow().setNavigationBarColor(Color.TRANSPARENT);

                  WindowInsetsControllerCompat controller =
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  // Keep system icons visible over the app's light header/background.
                  controller.setAppearanceLightStatusBars(true);
                  controller.setAppearanceLightNavigationBars(true);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      getWindow().setNavigationBarContrastEnforced(false);
                  }
              }

          }
          JAVA

      - name: Configure Android release signing
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_SIGNING_KEYSTORE_BASE64:?Missing ANDROID_SIGNING_KEYSTORE_BASE64}"
          : "${ANDROID_SIGNING_KEYSTORE_PASSWORD:?Missing ANDROID_SIGNING_KEYSTORE_PASSWORD}"
          : "${ANDROID_SIGNING_KEY_ALIAS:?Missing ANDROID_SIGNING_KEY_ALIAS}"
          : "${ANDROID_SIGNING_KEY_PASSWORD:?Missing ANDROID_SIGNING_KEY_PASSWORD}"

          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/maamara-market-release.jks"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_SIGNING_KEYSTORE_PASSWORD" >/dev/null 2>&1 || {
            echo "::error::The configured Android keystore could not be opened. Check the keystore Base64 and password secrets."
            exit 1
          }

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          if "android {" not in source:
              raise SystemExit("Generated Android app/build.gradle has no android block")

          signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_SIGNING_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_SIGNING_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_SIGNING_KEY_PASSWORD")
                  }
              }
          """
          source = source.replace("android {", "android {\n" + signing, 1)

          def block_bounds(text, opening):
              start = text.find(opening)
              if start < 0:
                  return None
              brace = text.find("{", start)
              depth = 0
              for index in range(brace, len(text)):
                  if text[index] == "{":
                      depth += 1
                  elif text[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return brace, index
              raise SystemExit(f"Unclosed Gradle block: {opening}")

          build_types = block_bounds(source, "buildTypes")
          if build_types is None:
              android_block = block_bounds(source, "android")
              source = source[:android_block[1]] + """
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          """ + source[android_block[1]:]
          else:
              bt_open, bt_close = build_types
              release_match = re.search(r"\brelease\s*\{", source[bt_open:bt_close])
              if release_match:
                  release_start = bt_open + release_match.start()
                  # Locate the release block's opening brace and insert the signing line.
                  release_brace = source.find("{", release_start)
                  source = source[:release_brace + 1] + "\n            signingConfig signingConfigs.release" + source[release_brace + 1:]
              else:
                  source = source[:bt_close] + """
                  release {
                      signingConfig signingConfigs.release
                  }
              """ + source[bt_close:]

          gradle.write_text(source)
          if "signingConfig signingConfigs.release" not in source:
              raise SystemExit("Release signing config was not applied to the generated Gradle project")
          print("Configured release signing without writing credentials into the repository.")
          PY

      - name: Build signed Android release APK and App Bundle
        working-directory: ${{ env.FRONTEND_DIR }}/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/maamara-market-release.jks
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Verify Android release signatures
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          jarsigner -verify -verbose "$AAB" >/dev/null
          echo "Verified signed release APK and AAB."

      - name: Upload signed Android release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: maa-mara-market-android-signed-release
          path: |
            ${{ env.FRONTEND_DIR }}/android/app/build/outputs/apk/release/app-release.apk
            ${{ env.FRONTEND_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Prepare stable signed Android APK and AAB filenames
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk maa-mara-market-android.apk
          cp android/app/build/outputs/bundle/release/app-release.aab maa-mara-market-android.aab

      - name: Publish latest signed Android release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mobile-latest --repo "${GITHUB_REPOSITORY}" >/dev/null
          gh release upload mobile-latest \
            "${FRONTEND_DIR}/maa-mara-market-android.apk" \
            "${FRONTEND_DIR}/maa-mara-market-android.aab" \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Remove temporary Android signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/maamara-market-release.jks"

      - name: Upload generated Android project
        uses: actions/upload-artifact@v4
        with:
          name: maa-mara-market-android-project
          path: ${{ env.FRONTEND_DIR }}/android/
          if-no-files-found: error
          retention-days: 14

  ios-project:
    name: Generate and compile iOS project
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maamara_market_project/frontend/package-lock.json

      - name: Install web dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Report optional iOS Firebase configuration
        env:
          FIREBASE_IOS_CONFIG: ${{ secrets.FIREBASE_IOS_CONFIG }}
        run: |
          if [ -n "$FIREBASE_IOS_CONFIG" ]; then
            echo "Firebase iOS configuration supplied; native push setup will be included."
          else
            echo "Firebase iOS configuration not supplied; preparing unsigned iOS build without native push setup."
          fi

      - name: Install temporary Capacitor build tools
        working-directory: ${{ env.FRONTEND_DIR }}
        # Runtime plugins (including push notifications) are pinned in package.json and the lockfile.
        # Install project generators/platform wrappers and Status Bar temporarily.
        run: npm install --no-save @capacitor/cli@7 @capacitor/android@7 @capacitor/ios@7 @capacitor/status-bar@7 @capacitor/app@7 typescript@5.8.3 sharp

      - name: Build mobile web bundle
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VITE_BUILD_TARGET: mobile
          VITE_API_URL: ${{ env.MOBILE_API_URL }}${{ env.MOBILE_API_PATH_PREFIX }}
          VITE_ROUTER_BASENAME: /
          VITE_NATIVE_PUSH_ENABLED: ${{ secrets.FIREBASE_IOS_CONFIG != '' }}
        run: npm run build:mobile

      - name: Generate iOS project and configure Firebase when credentials are available
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          FIREBASE_IOS_CONFIG: ${{ secrets.FIREBASE_IOS_CONFIG }}
        run: |
          npx cap add ios
          if [ -n "$FIREBASE_IOS_CONFIG" ]; then
            printf '%s' "$FIREBASE_IOS_CONFIG" > ios/App/App/GoogleService-Info.plist
            python3 - <<'PY'
          import plistlib
          from pathlib import Path

          config = plistlib.loads(Path("ios/App/App/GoogleService-Info.plist").read_bytes())
          expected_bundle = "com.maamaramarket.app"
          actual_bundle = config.get("BUNDLE_ID")
          if actual_bundle != expected_bundle:
              raise SystemExit(
                  f"Firebase iOS config BUNDLE_ID must be {expected_bundle}; got {actual_bundle!r}"
              )
          PY
            ruby - <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.find { |entry| entry.name == 'App' }
          raise 'App target was not found in the generated Xcode project' unless target
          app_group = project.main_group.find_subpath('App', false)
          raise 'App group was not found in the generated Xcode project' unless app_group
          file_ref = app_group.files.find { |file| file.path == 'GoogleService-Info.plist' }
          file_ref ||= app_group.new_file('GoogleService-Info.plist')
          unless target.resources_build_phase.files_references.include?(file_ref)
            target.resources_build_phase.add_file_reference(file_ref)
          end
          project.save
          RUBY
          fi

      - name: Generate MaaMara Market iOS app icon
        working-directory: ${{ env.FRONTEND_DIR }}
        run: node scripts/generate-native-app-icons.mjs ios

      - name: Build iOS simulator app
        working-directory: ${{ env.FRONTEND_DIR }}/ios
        run: xcodebuild -workspace App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Package generated iOS project
        working-directory: ${{ env.FRONTEND_DIR }}
        run: zip -qr maa-mara-market-ios-project.zip ios

      - name: Upload generated iOS project
        uses: actions/upload-artifact@v4
        with:
          name: maa-mara-market-ios-project
          path: ${{ env.FRONTEND_DIR }}/maa-mara-market-ios-project.zip
          if-no-files-found: error
          retention-days: 14
